<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=home.html">
<title>RN Research Network</title>
</head>
<body>
<p>Redirecting to <a href="home.html">home.html</a>...</p>
<button id="vpn-back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top" style="position:fixed;bottom:24px;right:20px;width:50px;height:50px;border-radius:50%;background:rgba(201,201,232,0.12);border:2px solid #c9c9e8;color:#c9c9e8;font-size:1.5rem;line-height:1;cursor:pointer;z-index:99999;display:none;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(201,201,232,0.45);backdrop-filter:blur(4px);transition:opacity 0.2s,transform 0.2s;">↑</button>
<script>
(function(){
  var btn = document.getElementById('vpn-back-to-top');
  if(!btn) return;
  function toggle(){ btn.style.display = (window.scrollY > 400) ? 'flex' : 'none'; }
  window.addEventListener('scroll', toggle, {passive:true});
  toggle();
  btn.addEventListener('mouseover', function(){ btn.style.boxShadow='0 0 28px rgba(201,201,232,0.7)'; btn.style.transform='translateY(-2px)'; });
  btn.addEventListener('mouseout', function(){ btn.style.boxShadow='0 0 18px rgba(201,201,232,0.45)'; btn.style.transform='translateY(0)'; });
})();
</script>

<!-- GLOBAL TYPOGRAPHY — READABILITY UPDATE -->
<style>
  body { font-size:16px !important; line-height:1.6; }
  p { font-size:1rem; line-height:1.6; margin-bottom:0.75rem; }
  li { font-size:1rem; line-height:1.6; }
  td, th { font-size:0.95rem; line-height:1.5; }
  .dir-card-desc, [class*="desc"], [class*="-body"] { font-size:1rem !important; line-height:1.6 !important; }
  .dir-card-title, [class*="-title"] { font-size:1.4rem !important; }
  @media(max-width:768px){ body { font-size:16px !important; } p, li { font-size:1rem !important; } }
</style>
<style id="vpn-font-boost">
  html { font-size: 19px !important; }
  body { font-size: 19px !important; line-height: 1.75 !important; }
  p, li, td, th, label, input, select, textarea, button, .dir-card-desc, .vpn-news-body, .qa-item, .pct-desc { font-size: 1rem !important; line-height: 1.75 !important; }
  h1, .h1 { font-size: 2.2rem !important; }
  h2, .h2 { font-size: 1.85rem !important; }
  h3, .h3, .dir-card-title { font-size: 1.55rem !important; }
  h4, .h4 { font-size: 1.3rem !important; }
  .dir-card-desc { font-size: 1.05rem !important; }
  .vpn-news-title { font-size: 1.1rem !important; }
  .vpn-news-body { font-size: 1rem !important; }
  small, .small, .sub, .footnote { font-size: 0.88rem !important; }
</style>
</body>
