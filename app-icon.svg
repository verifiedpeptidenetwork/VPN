<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#22104d"/>
      <stop offset="0.55" stop-color="#0b0524"/>
      <stop offset="1" stop-color="#03010b"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#9d3bff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.55" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#ffd400"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0d40" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#07031a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00f5ff" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- full-bleed background (works as a maskable icon) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- golden halo behind the shield -->
  <circle cx="256" cy="246" r="168" fill="#ffb300" opacity="0.22" filter="url(#soft)"/>

  <!-- shield -->
  <path d="M256 74 L392 122 C392 250 352 340 256 410 C160 340 120 250 120 122 Z"
        fill="url(#shieldFill)" stroke="url(#edge)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- peptide chain forming a check mark (verified) -->
  <g transform="translate(0,-20)">
  <polyline points="172,246 228,300 344,176" fill="none" stroke="url(#chain)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <circle cx="172" cy="246" r="22" fill="#00f5ff"/>
    <circle cx="200" cy="273" r="17" fill="#3ad0ff"/>
    <circle cx="228" cy="300" r="24" fill="#9d3bff"/>
    <circle cx="267" cy="259" r="18" fill="#d63bd8"/>
    <circle cx="305" cy="218" r="20" fill="#ff2d95"/>
    <circle cx="344" cy="176" r="25" fill="#ffd400"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="165" cy="239" r="6"/><circle cx="221" cy="292" r="7"/><circle cx="336" cy="168" r="7"/>
  </g>
  </g>

  <!-- VPN wordmark -->
  <text x="256" y="380" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="64" letter-spacing="6" fill="#ffffff" filter="url(#glow)">VPN</text>
</svg>
